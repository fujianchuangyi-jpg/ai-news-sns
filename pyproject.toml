[project]
name = "ainews"
version = "0.1.0"
description = "AI news aggregation and SNS draft generation for Instagram / X"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.69",
    "feedparser>=6.0.11",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pillow>=11.0",
    "pydantic>=2.10",
    "python-dateutil>=2.9",
    "pyyaml>=6.0",
    "selectolax>=0.3.27",
    "trafilatura>=2.0",
]

[project.scripts]
ainews = "ainews.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ainews"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

name: 日次下書き生成

on:
  schedule:
    # 毎朝 6:00 JST（= 21:00 UTC 前日）。cron は UTC で解釈される。
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      fake_llm:
        description: "LLMをスタブに差し替える（配線確認用）"
        type: boolean
        default: false

# 生成物とDBをコミットするので書き込み権限が要る
permissions:
  contents: write

concurrency:
  group: daily-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: uv をセットアップ
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 依存をインストール
        run: uv sync --frozen

      - name: 下書きを生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          uv run ainews run ${{ inputs.fake_llm && '--fake-llm' || '' }}

      - name: 生成物をコミット
        run: |
          git config user.name  "ainews-bot"
          git config user.email "ainews-bot@users.noreply.github.com"
          git add docs data/ainews.db
          # 変更が無い日（生成に失敗した等）はコミットせず正常終了する
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "下書き $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi

      - name: 失敗時に通知
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -sS -H "Content-Type: application/json" \
              -d "{\"content\":\"⚠️ 日次下書きの生成に失敗しました: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$DISCORD_WEBHOOK_URL"
          fi
